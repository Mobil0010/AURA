plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'dev.aura.player'
    compileSdk 36
    defaultConfig { applicationId 'dev.aura.player'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; minSdk 26; targetSdk 36; versionCode 26; versionName '0.20.0'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }; externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } } }
    if (project.hasProperty('auraVersionCode')) defaultConfig.versionCode = project.property('auraVersionCode').toInteger()
    if (project.hasProperty('auraVersionName')) defaultConfig.versionName = project.property('auraVersionName')
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.window:window-java:1.4.0'
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'com.google.android.gms:play-services-cast-framework:22.1.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
}
